<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2F5E27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sapan Çiftliği">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Sapan Çiftliği</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#9A6435;--wood-l:#C48A52;--wood-d:#5E3818;--wood-dd:#3F240E;
  --hay:#F2C14E;--barn:#C8453A;--barn-d:#8E2E26;--cream:#FFF6E0;--ink:#2B2118;
  --bg1:#4F8A3D;--bg2:#2F5E27;--sky1:#8FD0EE;--sky2:#E4F5FB;--hill1:#7CC05F;--hill2:#5FA548;--sun:#FFE27A;
}
body.t-morning{--sky1:#9ED6EE;--sky2:#FFE9C7;--sun:#FFD36B}
body.t-evening{--bg1:#5A6E3A;--bg2:#34431F;--sky1:#E9875A;--sky2:#FBD29A;--hill1:#6E9A4E;--hill2:#4F7A38;--sun:#FF9B55}
body.t-night{--bg1:#23384A;--bg2:#141F2C;--sky1:#0F1A33;--sky2:#2E4470;--hill1:#2E5A3A;--hill2:#1F412A;--sun:#F4F1D0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;color:var(--cream);background:radial-gradient(120% 70% at 50% 0%,var(--bg1),var(--bg2) 75%) var(--bg2)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--hay);outline-offset:3px}
body.chrome-off header,body.chrome-off footer{visibility:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* wood material */
.wood{background:repeating-linear-gradient(0deg,rgba(60,30,10,.09) 0 2px,transparent 2px 8px),repeating-linear-gradient(90deg,transparent 0 37px,rgba(60,30,10,.08) 37px 39px),linear-gradient(var(--wood-l),var(--wood));
  border:3px solid var(--wood-d);box-shadow:0 5px 0 var(--wood-dd),inset 0 2px 0 rgba(255,255,255,.25)}
.nails::before,.nails::after{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:#3F240E;box-shadow:inset 1px 1px 0 rgba(255,255,255,.3)}
.nails::before{left:8px}.nails::after{right:8px}

/* header */
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px 8px}
.plaque{position:relative;flex:1;min-width:0;border-radius:14px;padding:3px 20px 4px;display:flex;align-items:baseline;gap:10px}
.plaque b{font-size:32px;font-weight:800;line-height:1.05;color:var(--cream);text-shadow:0 2px 0 var(--wood-dd);font-variant-numeric:tabular-nums}
.plaque b.bump{animation:bump .28s ease-out}
.plaque small{font-size:13px;font-weight:700;opacity:.9;white-space:nowrap;margin-left:auto;text-shadow:0 1px 0 var(--wood-dd)}
@keyframes bump{40%{transform:scale(1.15)}}
.next{flex:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;line-height:1}
.next .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid var(--wood-d);box-shadow:0 3px 0 var(--wood-dd);margin-bottom:3px}
.next .dot.in{animation:dropin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes dropin{from{transform:scale(.3) translateY(-8px)}}
.sq{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;position:relative}

#stage{flex:1 1 0;position:relative;min-height:0;overflow:hidden;touch-action:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.25)}
footer{flex:none;display:flex;justify-content:center;gap:3px;padding:8px 10px 10px}
.slot{flex:1;max-width:40px;display:flex;flex-direction:column;align-items:center}
.slot i{font-style:normal;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,4.3vw,22px);background:rgba(0,0,0,.22)}
.slot.on i{background:var(--cream);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.slot.off i{color:rgba(255,246,224,.45);font-weight:800}
.slot span{font-size:10px;font-weight:700;opacity:.75;margin-top:2px}
.slot.fresh i{animation:glow 1.4s ease-out 2}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(242,193,78,.9)}100%{box-shadow:0 0 0 14px rgba(242,193,78,0)}}

#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-30px) rotate(-2deg);opacity:0;border-radius:14px;padding:6px 18px 7px;font-weight:700;font-size:16px;text-align:center;max-width:88%;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);z-index:4;color:var(--cream);text-shadow:0 1px 0 var(--wood-dd)}
#toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}

/* tutorial hand */
#tut{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,0);text-align:center;width:280px}
#tut .hand{font-size:44px;display:inline-block;animation:drag 1.8s ease-in-out infinite;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3))}
#tut p{font-weight:800;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.35);margin-bottom:4px}
@keyframes drag{0%{transform:translateY(0);opacity:0}15%{opacity:1}60%{transform:translateY(60px)}75%{transform:translateY(60px);opacity:1}100%{transform:translateY(60px);opacity:0}}

/* screens */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px)}
.screen[hidden]{display:none}
.modal{background:rgba(20,30,12,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal .panel{animation:panelin .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes panelin{from{transform:translateY(40px) scale(.9);opacity:0}}
.panel{position:relative;width:100%;max-width:340px;background:var(--cream);color:var(--ink);border:4px solid var(--wood-d);border-radius:26px;padding:26px 20px 20px;text-align:center;box-shadow:0 8px 0 var(--wood-dd),0 24px 50px rgba(0,0,0,.35)}
.panel h2{font-size:34px;font-weight:800;line-height:1;color:var(--barn)}
.tab{position:absolute;top:-22px;left:50%;transform:translateX(-50%) rotate(-2deg);border-radius:12px;padding:2px 18px 4px;font-weight:800;font-size:19px;white-space:nowrap;color:var(--cream);text-shadow:0 2px 0 var(--wood-dd)}

.btn{display:block;width:100%;border-radius:18px;font-weight:800;font-size:24px;padding:9px 18px 11px;margin-top:12px;transition:transform .08s}
.btn:active{transform:translateY(4px)}
.btn.red{background:var(--barn);color:#fff;box-shadow:0 6px 0 var(--barn-d),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.red:active{box-shadow:0 2px 0 var(--barn-d)}
.btn.plain{background:#fff;color:var(--ink);font-size:19px;padding:7px 14px 9px;border:3px solid var(--wood-d);box-shadow:0 4px 0 var(--wood-dd)}
.btn.plain:active{box-shadow:0 1px 0 var(--wood-dd)}
.row{display:flex;gap:10px}.row .btn{flex:1}

/* hanging sign logo */
.hang{position:relative;padding-top:42px;display:inline-block;transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}
.hang::before,.hang::after{content:"";position:absolute;top:0;width:5px;height:50px;background:repeating-linear-gradient(180deg,#D9B07A 0 5px,#A77C45 5px 9px);border-radius:3px}
.hang::before{left:22%;transform:rotate(8deg);transform-origin:top}.hang::after{right:22%;transform:rotate(-8deg);transform-origin:top}
.sign{position:relative;border-radius:22px;padding:12px 28px 16px}
.sign h1{font-weight:800;font-size:clamp(46px,14vw,62px);line-height:.82;color:var(--cream);text-shadow:0 4px 0 var(--wood-dd);letter-spacing:.5px;text-align:center}
@keyframes swing{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}

/* splash */
#splash{z-index:40;background:linear-gradient(var(--sky1),var(--sky2) 62%);overflow:hidden;justify-content:flex-start;cursor:pointer}
.sun{position:absolute;top:5%;left:9%;width:70px;height:70px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px rgba(255,255,255,.18),0 0 0 30px rgba(255,255,255,.1)}
body.t-night .sun{box-shadow:inset -18px -6px 0 rgba(0,0,0,.12),0 0 40px rgba(244,241,208,.35)}
.stars{position:absolute;inset:0 0 40% 0;display:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 42%,#fff,transparent),radial-gradient(1.5px 1.5px at 12% 55%,#fff,transparent),radial-gradient(2px 2px at 55% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff,transparent)}
body.t-night .stars{display:block;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.5}}
.cloud{position:absolute;width:120px;height:36px;border-radius:30px;background:rgba(255,255,255,.85);animation:drift 38s linear infinite}
.cloud::before{content:"";position:absolute;left:24px;top:-20px;width:56px;height:48px;border-radius:50%;background:inherit}
.cloud.c1{top:16%;left:-140px}.cloud.c2{top:30%;left:-140px;transform:scale(.7);animation-duration:52s;animation-delay:-20s}
body.t-night .cloud{background:rgba(180,200,240,.18)}
@keyframes drift{to{left:110%}}
.hills{position:absolute;left:0;right:0;bottom:0;height:46%}
.hills svg{position:absolute;bottom:0;width:100%;height:100%}
.splash-top{position:relative;z-index:2;margin-top:4vh;text-align:center}
.demo{position:relative;z-index:2;height:90px;width:260px;margin-top:auto;margin-bottom:10px}
.demo span{position:absolute;top:10px;font-size:52px;line-height:1;left:50%;margin-left:-26px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18))}
.demo .a{animation:inl 1.5s cubic-bezier(.5,0,.6,1) infinite}
.demo .b{animation:inr 1.5s cubic-bezier(.5,0,.6,1) infinite}
.demo .c{animation:popc 1.5s ease-out infinite;opacity:0}
.demo .puff{animation:puff 1.5s ease-out infinite;opacity:0;font-size:60px}
@keyframes inl{0%{transform:translateX(-105px);opacity:1}45%{transform:translateX(-26px)}50%{transform:translateX(-22px);opacity:1}52%,100%{opacity:0}}
@keyframes inr{0%{transform:translateX(105px);opacity:1}45%{transform:translateX(26px)}50%{transform:translateX(22px);opacity:1}52%,100%{opacity:0}}
@keyframes popc{0%,48%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.35)}72%,90%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.15) translateY(-10px)}}
@keyframes puff{0%,46%{opacity:0;transform:scale(.4)}55%{opacity:.9;transform:scale(1.2)}70%,100%{opacity:0;transform:scale(1.8)}}
.loader{position:relative;z-index:2;width:min(300px,82vw);margin-bottom:calc(8vh + env(safe-area-inset-bottom,0px))}
.fence{position:relative;height:46px;display:flex;justify-content:space-between;align-items:flex-end}
.fence .rail{position:absolute;left:0;height:9px;border-radius:3px;background:var(--wood-l);border:2px solid var(--wood-d);transition:width .3s}
.fence .r1{top:12px}.fence .r2{top:28px}
.fence i{position:relative;z-index:1;width:14px;height:46px;border-radius:4px 4px 2px 2px;background:var(--wood);border:2px solid var(--wood-d);transform:translateY(-60px) scaleY(.4);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.fence i.on{transform:none;opacity:1}
.status{margin-top:12px;text-align:center;font-weight:800;font-size:20px;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.35);min-height:30px}
.status.ready{animation:breathe 1.3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}

/* barn doors */
#doors{position:fixed;inset:0;z-index:60;display:flex;pointer-events:none}
.door{position:relative;flex:1;background:repeating-linear-gradient(90deg,#B83A30 0 34px,#A9342B 34px 37px);transition:transform .5s cubic-bezier(.7,0,.25,1);transform:translateX(-101%);border-right:3px solid #7E2620}
.door.r{transform:translateX(101%);border-right:none;border-left:3px solid #7E2620}
.door svg{position:absolute;inset:6% 9%;width:82%;height:88%}
#doors.shut .door{transform:none}

/* menu */
#menu{background:linear-gradient(rgba(20,30,12,.05),rgba(20,30,12,.55) 60%,rgba(20,30,12,.75))}
.greet{border-radius:30px;padding:3px 16px 5px;font-weight:700;font-size:15px;background:rgba(0,0,0,.28);margin-bottom:auto}
.menu-body{width:100%;max-width:340px;text-align:center;margin-bottom:auto}
.tiles{display:flex;gap:10px;margin:22px 0 4px}
.tile{flex:1;border-radius:16px;padding:6px 8px 7px;background:rgba(0,0,0,.28);text-align:center}
.tile b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.tile span{font-size:13px;opacity:.85;font-weight:700}
.menu-body .btn.red{font-size:30px;padding:10px 18px 13px;margin-top:16px}
.menu-body .btn.plain{background:rgba(255,246,224,.95)}

/* game over */
.big{font-size:60px;font-weight:800;line-height:1;margin:10px 0 0;color:var(--ink);font-variant-numeric:tabular-nums}
.rec{display:inline-block;background:var(--hay);border-radius:10px;padding:1px 12px 3px;font-weight:800;margin-top:6px;transform:rotate(-3deg);animation:stamp .5s cubic-bezier(.3,1.8,.5,1) .6s both}
@keyframes stamp{from{transform:scale(2.5) rotate(-12deg);opacity:0}}
.stats{display:flex;gap:8px;margin:14px 0 4px}
.stats div{flex:1;border-radius:14px;background:#F3E4C4;padding:6px 4px 7px}
.stats b{display:block;font-size:24px;line-height:1.15;font-weight:800}
.stats span{font-size:12px;font-weight:700;color:#7A5A36}
.sub{font-size:15px;color:#6B5234;margin-top:4px}

/* barn book */
.book{max-height:min(560px,76vh);display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;overflow:auto;padding:4px 2px 6px;margin-top:12px}
.card{display:flex;flex-direction:column;align-items:center}
.card i{font-style:normal;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:36px;border:3px solid rgba(70,40,15,.45);box-shadow:0 3px 0 rgba(70,40,15,.25)}
.card.lock i{background:#E5D5B5!important;border-color:#C9B38C}
.card.lock i em{font-style:normal;filter:brightness(0);opacity:.22}
.card b{font-size:15px;font-weight:800;margin-top:3px;line-height:1.1}
.card span{font-size:12px;color:#7A5A36;font-weight:700}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:#F3E4C4;color:var(--ink);font-size:22px;font-weight:800;line-height:1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="chrome-off">
<div id="app">
  <header>
    <div class="plaque wood nails"><b id="score">0</b><small>Rekor <span id="best">0</span></small></div>
    <div class="next"><div class="dot" id="next">🐣</div>sıradaki</div>
    <button class="sq wood" id="pauseBtn" aria-label="Duraklat"><svg width="20" height="20" viewBox="0 0 20 20" fill="#FFF6E0"><rect x="3" y="2" width="5" height="16" rx="2"/><rect x="12" y="2" width="5" height="16" rx="2"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="game" aria-label="Oyun alanı"></canvas>
    <div id="toast" class="wood"></div>
    <div id="tut" hidden><p>Aşağı çek, nişan al, bırak</p><span class="hand">👆</span></div>
  </div>
  <footer id="strip" role="button" aria-label="Ahır defterini aç"></footer>
</div>

<section class="screen" id="menu" hidden>
  <div class="greet" id="greet"></div>
  <div class="menu-body">
    <div class="hang"><div class="sign wood nails"><h1>Sapan<br>Çiftliği</h1></div></div>
    <div class="tiles"><div class="tile"><b id="mBest">0</b><span>rekor</span></div><div class="tile"><b id="mDisc">1/12</b><span>hayvan bulundu</span></div></div>
    <button class="btn red" id="play">Oyna</button>
    <div class="row"><button class="btn plain" id="bookBtn">Ahır defteri</button><button class="btn plain" id="muteBtn" style="flex:0 0 70px" aria-label="Sesi aç/kapat"></button></div>
  </div>
</section>

<section class="screen modal" id="pause" hidden>
  <div class="panel"><div class="tab wood">Mola</div>
    <p class="sub" style="margin-top:6px">Hayvanlar bekliyor, acele yok.</p>
    <button class="btn red" id="resume">Devam et</button>
    <button class="btn plain" id="restart">Baştan başla</button>
    <div class="row"><button class="btn plain" id="toMenu">Ana menü</button><button class="btn plain" id="muteBtn2" style="flex:0 0 70px" aria-label="Sesi aç/kapat"></button></div>
  </div>
</section>

<section class="screen modal" id="over" hidden>
  <div class="panel"><div class="tab wood">Ahır doldu!</div>
    <div class="big" id="finalScore">0</div>
    <div class="rec" id="newRec" hidden>Yeni rekor!</div>
    <div class="stats"><div><b id="stBig">🐣</b><span id="stBigN">en büyük</span></div><div><b id="stMerge">0</b><span>birleşme</span></div><div><b id="stShot">0</b><span>atış</span></div></div>
    <button class="btn red" id="again">Tekrar oyna</button>
    <div class="row"><button class="btn plain" id="share">Paylaş</button><button class="btn plain" id="overMenu">Menü</button></div>
  </div>
</section>

<section class="screen modal" id="book" hidden>
  <div class="panel book"><div class="tab wood">Ahır defteri</div>
    <button class="x" id="bookClose" aria-label="Kapat">×</button>
    <p class="sub" id="bookSub" style="margin-top:6px"></p>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="screen" id="splash">
  <div class="stars"></div><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hills"><svg viewBox="0 0 400 300" preserveAspectRatio="none">
    <path d="M0 120 C80 60 170 70 250 110 S360 90 400 70 V300 H0Z" fill="var(--hill2)"/>
    <g transform="translate(300 64) scale(.8)">
      <path d="M0 40 L38 8 L76 40 V86 H0Z" fill="#B83A30" stroke="#6E2019" stroke-width="3"/>
      <path d="M-6 42 L38 4 L82 42" fill="none" stroke="#5B3A22" stroke-width="7" stroke-linecap="round"/>
      <rect x="24" y="50" width="28" height="36" fill="#9E2F27" stroke="#FFF6E0" stroke-width="3"/>
      <path d="M24 50 L52 86 M52 50 L24 86" stroke="#FFF6E0" stroke-width="3"/>
      <circle cx="38" cy="30" r="6" fill="#FFF6E0"/>
    </g>
    <path d="M0 175 C100 130 220 150 300 170 S380 160 400 150 V300 H0Z" fill="var(--hill1)"/>
  </svg></div>
  <div class="splash-top"><div class="hang"><div class="sign wood nails"><h1>Sapan<br>Çiftliği</h1></div></div></div>
  <div class="demo" aria-hidden="true"><span class="a">🐣</span><span class="b">🐣</span><span class="puff">💨</span><span class="c">🐭</span></div>
  <div class="loader">
    <div class="fence" id="fence"><div class="rail r1" id="rail1" style="width:0"></div><div class="rail r2" id="rail2" style="width:0"></div></div>
    <div class="status" id="status">Çitler çakılıyor…</div>
  </div>
</section>

<div id="doors" aria-hidden="true">
  <div class="door l"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="3" y="2" width="94" height="96" fill="none" stroke="#FFF6E0" stroke-width="5" vector-effect="non-scaling-stroke"/><path d="M3 2 L97 98 M97 2 L3 98" stroke="#FFF6E0" stroke-width="10" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="door r"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="3" y="2" width="94" height="96" fill="none" stroke="#FFF6E0" stroke-width="5" vector-effect="non-scaling-stroke"/><path d="M3 2 L97 98 M97 2 L3 98" stroke="#FFF6E0" stroke-width="10" vector-effect="non-scaling-stroke"/></svg></div>
</div>

<script>
(()=>{
'use strict';
const W=420,H=720,F=16,DANGER_Y=H-150,SL={x:W/2,y:H-80};

let lastSz='';
function resize(force){

  const sz=aw+'x'+ah+'@'+(window.devicePixelRatio||1);if(aw<50||ah<50||(sz===lastSz&&!force))return;lastSz=sz;
  scale=Math.max(.3,Math.min(aw/W,ah/H));dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  tokens=LV.map(makeToken);uniTok=makeToken(UNI);buildBg();buildFg();placeTut();
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return `rgb(${f(r)},${f(g)},${f(b)})`}
function makeToken(l){
  const k=scale*dpr,half=l.r+5,s=Math.ceil(half*2*k),c=document.createElement('canvas');
  c.width=c.height=s;const g=c.getContext('2d');g.scale(k,k);
  const gr=g.createRadialGradient(half-l.r*.35,half-l.r*.4,l.r*.1,half,half,l.r);
  gr.addColorStop(0,shade(l.c,.45));gr.addColorStop(.6,l.c);gr.addColorStop(1,shade(l.c,-.18));
  g.beginPath();g.arc(half,half,l.r,0,7);g.fillStyle=gr;g.fill();
  g.lineWidth=Math.max(2.2,l.r*.085);g.strokeStyle=shade(l.c,-.55);g.globalAlpha=.75;g.stroke();g.globalAlpha=1;
  g.beginPath();g.ellipse(half-l.r*.36,half-l.r*.46,l.r*.24,l.r*.14,-.6,0,7);g.fillStyle='rgba(255,255,255,.55)';g.fill();
  g.font=`${l.r*1.2}px ${EMOJI_FONT}`;g.textAlign='center';g.textBaseline='middle';
  g.fillText(l.e,half,half+l.r*.09);

}
function mkCanvas(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.scale(scale*dpr,scale*dpr);return [c,g]}
function buildBg(){
  const [c,g]=mkCanvas();bg=c;
  for(let y=0,i=0;y<H;y+=40,i++){g.fillStyle=i%2?'#66A84F':'#6FB358';g.fillRect(0,y,W,40)}
  let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  g.lineCap='round';
  for(let i=0;i<95;i++){const x=F+rnd()*(W-2*F),y=F+rnd()*(DANGER_Y-F-10);
    g.strokeStyle='rgba(50,100,40,.55)';g.lineWidth=1.6;g.beginPath();
    g.moveTo(x-3,y-4);g.lineTo(x,y+2);g.lineTo(x+3,y-5);g.stroke();
    if(rnd()<.2){const col=['#FFF6D6','#FFD84D','#F7B6D2'][Math.floor(rnd()*3)];g.fillStyle=col;
      for(let p=0;p<5;p++){g.beginPath();g.arc(x+7+Math.cos(p*1.26)*2.4,y+Math.sin(p*1.26)*2.4,1.7,0,7);g.fill()}
      g.fillStyle='#E0A020';g.beginPath();g.arc(x+7,y,1.3,0,7);g.fill()}}
  g.fillStyle='#D9B36B';g.fillRect(0,DANGER_Y,W,H-DANGER_Y);
  for(let i=0;i<160;i++){const x=rnd()*W,y=DANGER_Y+rnd()*(H-DANGER_Y),a=rnd()*Math.PI,l=6+rnd()*9;
    g.strokeStyle=rnd()<.5?'#EFCB7E':'#B8904C';g.lineWidth=1.3;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  const sh=g.createLinearGradient(0,DANGER_Y,0,DANGER_Y+14);sh.addColorStop(0,'rgba(60,40,10,.28)');sh.addColorStop(1,'rgba(60,40,10,0)');
  g.fillStyle=sh;g.fillRect(0,DANGER_Y,W,14);
  g.strokeStyle='rgba(120,80,30,.35)';g.lineWidth=4;g.lineJoin='round';
  for(const x of [70,140,W-140,W-70])for(const y of [DANGER_Y+40,DANGER_Y+95]){g.beginPath();g.moveTo(x-12,y+7);g.lineTo(x,y-5);g.lineTo(x+12,y+7);g.stroke()}
  if(TODINFO.tint){g.fillStyle=TODINFO.tint;g.fillRect(0,0,W,H)}
  if(TOD==='night'){const lg=g.createRadialGradient(SL.x,SL.y,10,SL.x,SL.y,170);lg.addColorStop(0,'rgba(255,200,110,.35)');lg.addColorStop(1,'rgba(255,200,110,0)');
    g.fillStyle=lg;g.fillRect(0,0,W,H)}
}
function buildFg(){
  const [c,g]=mkCanvas();fg=c;
  const night=TOD==='night';
  g.fillStyle=night?'#1B2B24':'#3F7432';g.beginPath();g.rect(0,0,W,H);g.rect(F,F,W-2*F,H-2*F);g.fill('evenodd');
  const rail=(x,y,w,h)=>{g.fillStyle=night?'#8A6038':'#B07A45';g.fillRect(x,y,w,h);g.strokeStyle='#5E3818';g.lineWidth=1.5;g.strokeRect(x,y,w,h);
    g.fillStyle='rgba(255,255,255,.2)';w>h?g.fillRect(x,y+1,w,2):g.fillRect(x+1,y,2,h)};
  const r=F-4;rail(2,2,W-4,r-2);rail(2,H-r,W-4,r-2);rail(2,2,r-2,H-4);rail(W-r,2,r-2,H-4);
  const post=(x,y)=>{g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x-7,y-5,16,16);g.fillStyle='#7A4B24';g.fillRect(x-8,y-8,16,16);g.strokeStyle='#4A2C12';g.lineWidth=2;g.strokeRect(x-8,y-8,16,16);
    g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1;g.beginPath();g.arc(x,y,4,0,7);g.stroke()};
  for(let x=F/2;x<=W;x+=W/6)post(Math.min(x,W-F/2),F/2),post(Math.min(x,W-F/2),H-F/2);
  for(let y=F/2+H/9;y<H-F;y+=H/9)post(F/2,y),post(W-F/2,y);
  if(night){g.fillStyle='rgba(255,210,120,.9)';g.beginPath();g.arc(W-F/2,H-F/2,5,0,7);g.fill()}
}

let ac=null;
function ensureAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,t0,dur,type='sine',vol=.18,f2){
  if(!ac||muted)return;const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.03)}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26];
const note=s=>330*2**(s/12);
const sfx={
  tick:p=>tone(500+p*500,0,.04,'square',.04),
  launch:p=>{tone(180,0,.18,'triangle',.22,500+p*500);tone(90,0,.12,'sine',.15,60)},
  bump:()=>tone(140,0,.08,'sine',.12,90),
  merge:l=>{tone(note(PENTA[l]),0,.16,'triangle',.2);tone(note(PENTA[l]+7),.07,.22,'sine',.16)},
  magic:()=>[0,4,7,12,16].forEach((s,i)=>tone(note(s+12),i*.06,.25,'sine',.12)),
  legend:()=>[0,4,7,12,16,19,24].forEach((s,i)=>tone(note(s),i*.08,.4,'triangle',.16)),
  over:()=>[12,7,4,0].forEach((s,i)=>tone(note(s),i*.14,.3,'triangle',.18)),
  click:()=>tone(700,0,.05,'triangle',.1,900),
  creak:()=>{tone(90,0,.45,'sawtooth',.05,60);tone(130,.05,.4,'sawtooth',.03,95)},
  rooster:()=>{tone(620,0,.12,'sawtooth',.07,760);tone(760,.14,.16,'sawtooth',.07,900);tone(900,.32,.5,'sawtooth',.07,640)}};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- game logic ---------- */
function mk(lv,x,y,uni=false){const l=uni?UNI:LV[lv];
  return {id:idc++,lv,uni,x,y,vx:0,vy:0,r:l.r,age:0,pop:uni?1:0,sq:0,sqa:0,danger:0,dead:false}}
function pick(){
  shots++;
  if(shots>12&&!lastUni&&Math.random()<.055){lastUni=true;return {uni:true,lv:-1}}
  lastUni=false;
  const cap=Math.max(1,Math.min(4,maxLv-1)),w=[6,5,3,2,1].slice(0,cap+1),tot=w.reduce((a,b)=>a+b);
  let r=Math.random()*tot;for(let i=0;i<w.length;i++){if((r-=w[i])<0)return {uni:false,lv:i}}return {uni:false,lv:0}}
function reset(){
  bodies=[];pending=[];parts=[];floats=[];score=0;maxLv=0;shots=0;launched=0;merges=0;lastUni=false;combo=0;dangerMax=0;shake=0;
  cur=pick();next=pick();loadT=0;aiming=false;pull=null;updHud(true);
}
function show(id,on){$(id).hidden=!on}
function startGame(){ensureAudio();sfx.click();reset();state='play';document.body.classList.remove('chrome-off');['menu','over','pause','book'].forEach(i=>show(i,false));placeTut()}
function toMenu(){state='menu';document.body.classList.add('chrome-off');bodies=[];parts=[];floats=[];cur=null;demoT=.4;['over','pause','book'].forEach(i=>show(i,false));show('menu',true);refreshMenu();placeTut()}
function refreshMenu(){$('greet').textContent=TODINFO.greet;$('mBest').textContent=best.toLocaleString('tr-TR');
  $('mDisc').textContent=(disc.size+(uniSeen?1:0))+'/12'}
function gameOver(){
  state='over';aiming=false;pull=null;sfx.over();vib([60,40,60]);
  const rec=score>best;if(rec){best=score;store.set('best',best)}
  $('newRec').hidden=!rec;$('stBig').textContent=LV[maxLv].e;$('stBigN').textContent=LV[maxLv].n.toLowerCase();
  $('stMerge').textContent=merges;$('stShot').textContent=launched;$('finalScore').textContent='0';
  updHud();placeTut();setTimeout(()=>{show('over',true);countUp($('finalScore'),score)},750);
}
function countUp(el,to){const t0=performance.now(),d=Math.min(1400,400+to/4);
  const step=n=>{const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e).toLocaleString('tr-TR');if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function gain(v,x,y,label){
  if(!live())return;
  combo=time-lastMerge<1.3?combo+1:1;lastMerge=time;
  const mult=Math.min(combo,5),pts=v*mult;score+=pts;
  floats.push({x,y,t:0,txt:'+'+pts,big:false});
  if(mult>1)floats.push({x:W/2,y:H*.42,t:0,txt:`Kombo x${mult}!`,big:true,huge:true});
  if(label)floats.push({x,y:y-28,t:0,txt:label,big:true});
  updHud();
}
function discover(lv){
  if(!live())return;
  if(lv>maxLv)maxLv=lv;
  if(disc.has(lv))return;disc.add(lv);store.set('disc',JSON.stringify([...disc]));freshSlot=lv;renderStrip();
  if(lv===TOP){toast('🐳 Çiftlikte balina mı?! Burada her şey mümkün.');shake=.6}
  else toast(`Yeni hayvan: ${LV[lv].e} ${LV[lv].n}!`);
}
function clampIn(b){b.x=Math.min(W-F-b.r,Math.max(F+b.r,b.x));b.y=Math.min(H-F-b.r,Math.max(F+b.r,b.y))}
function merge(a,b){
  a.dead=b.dead=true;
  if(a.lv===TOP){legend((a.x+b.x)/2,(a.y+b.y)/2);return}
  const ma=a.r*a.r,mb=b.r*b.r,M=ma+mb,nl=a.lv+1;
  const n=mk(nl,(a.x*ma+b.x*mb)/M,(a.y*ma+b.y*mb)/M);
  n.vx=(a.vx*ma+b.vx*mb)/M*.55;n.vy=(a.vy*ma+b.vy*mb)/M*.55;n.age=Math.max(a.age,b.age,1);
  clampIn(n);pending.push(n);
  burst(n.x,n.y,[LV[nl].c,'#FFF8E7',LV[a.lv].c],12+nl*3,120+nl*20);
  if(live()){merges++;sfx.merge(nl);vib(10+nl*3);gain(LV[nl].v,n.x,n.y);discover(nl);if(nl>=8)shake=Math.max(shake,.25)}
}
function legend(x,y){
  burst(x,y,['#FF5E5E','#FFB84D','#FFE45E','#6FE07A','#5EC8FF','#9B7BFF'],90,420);
  if(!live())return;
  score+=4096;updHud();shake=.9;sfx.legend();vib([30,30,30,30,80]);
  floats.push({x,y,t:0,txt:'+4096 Efsane!',big:true,huge:true});
  toast('🌈 İki balina gökkuşağına karıştı!');
}
function upgrade(o,u){
  burst(u.x,u.y,['#FF9ECF','#B89CFF','#8FE3FF','#FFF3A6'],28,220);
  if(!live())return;sfx.magic();vib(25);
  if(o.lv<TOP){o.lv++;o.r=LV[o.lv].r;o.pop=.2;clampIn(o);gain(LV[o.lv].v,o.x,o.y,'Sihir!');discover(o.lv)}
  else gain(1024,o.x,o.y,'Sihir!');
}
function launch(){
  const sp=pull.power*MAXSPEED,b=mk(cur.lv,SL.x,SL.y,cur.uni);
  b.vx=pull.ux*sp;b.vy=pull.uy*sp;b.pop=1;pending.push(b);launched++;
  sfx.launch(pull.power);vib(8);
  if(cur.uni&&!uniSeen){uniSeen=true;store.set('uni','1');toast('🦄 Tek boynuz dokunduğu hayvanı bir üst seviyeye taşır!')}
  if(!tutDone){tutDone=true;store.set('tut','1');placeTut()}
  cur=null;loadT=.32;
}
function burst(x,y,cols,n,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.3+Math.random()*.7);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:.5+Math.random()*.5,c:cols[i%cols.length],s:2+Math.random()*4})}}

function physics(dt){
  const N=4,h=dt/N;
  for(let s=0;s<N;s++){
    const f=Math.exp(-DAMP*h);
    for(const b of bodies){if(b.dead)continue;
      if(b.age>.3&&b.y+b.r*.3>DANGER_Y)b.vy-=HAYPUSH*h;
      b.x+=b.vx*h;b.y+=b.vy*h;b.vx*=f;b.vy*=f;
      const sp=Math.hypot(b.vx,b.vy);if(sp>0){const k=Math.max(0,sp-COUL*h)/sp;b.vx*=k;b.vy*=k}
      let hit=0;
      if(b.x<F+b.r){b.x=F+b.r;if(b.vx<0){hit=-b.vx;b.vx=-b.vx*REST_WALL}}
      if(b.x>W-F-b.r){b.x=W-F-b.r;if(b.vx>0){hit=b.vx;b.vx=-b.vx*REST_WALL}}
      if(b.y<F+b.r){b.y=F+b.r;if(b.vy<0){hit=-b.vy;b.vy=-b.vy*REST_WALL}}
      if(b.y>H-F-b.r){b.y=H-F-b.r;if(b.vy>0){hit=b.vy;b.vy=-b.vy*REST_WALL}}
      if(hit>350&&time-lastBump>.08){lastBump=time;if(live())sfx.bump();b.sq=Math.min(1,hit/900)}
    }
    for(let i=0;i<bodies.length;i++){const a=bodies[i];if(a.dead)continue;
      for(let j=i+1;j<bodies.length;j++){const b=bodies[j];if(b.dead)continue;
        const dx=b.x-a.x,dy=b.y-a.y,R=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=R*R)continue;
        if(!a.uni&&!b.uni&&a.lv===b.lv){merge(a,b);break}
        if(a.uni!==b.uni){const u=a.uni?a:b,o=a.uni?b:a;u.dead=true;upgrade(o,u);if(a.dead)break;continue}
        const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,ov=R-d,ma=a.r*a.r,mb=b.r*b.r,im=1/ma+1/mb;
        const c=ov/im*.85;a.x-=nx*c/ma;a.y-=ny*c/ma;b.x+=nx*c/mb;b.y+=ny*c/mb;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(rv<0){const J=-(1+REST)*rv/im;a.vx-=J*nx/ma;a.vy-=J*ny/ma;b.vx+=J*nx/mb;b.vy+=J*ny/mb;
          const q=Math.min(1,-rv/800);if(q>.12){const ang=Math.atan2(ny,nx);
            if(q>a.sq){a.sq=q;a.sqa=ang}if(q>b.sq){b.sq=q;b.sqa=ang}}
          if(-rv>320&&time-lastBump>.07){lastBump=time;if(live())sfx.bump()}}
      }}
    if(pending.length){bodies.push(...pending);pending=[]}
    bodies=bodies.filter(b=>!b.dead);
  }
}
function demo(dt){
  demoT-=dt;if(demoT>0)return;demoT=1.3+Math.random()*1.1;
  if(bodies.length>13||bodies.some(b=>b.lv>=6)){for(const b of bodies)burst(b.x,b.y,[LV[b.lv].c,'#FFF8E7'],8,160);bodies=[];demoT=.8;return}
  const a=(Math.random()-.5)*1.9,sp=650+Math.random()*700,b=mk(Math.floor(Math.random()*3),SL.x,SL.y);
  b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;b.pop=.3;pending.push(b);
}
function update(dt){
  time+=dt;shake=Math.max(0,shake-dt*1.6);
  if(state==='play'||state==='menu'){
    physics(dt);
    if(state==='menu')demo(dt);
    if(state==='play'&&!cur){loadT-=dt;if(loadT<=0){cur=next;next=pick();if(!cur.uni)discover(cur.lv);updHud(true)}}
    dangerMax=0;
    for(const b of bodies){b.age+=dt;

    ?`<div class="slot on${i===freshSlot?' fresh':''}"><i>${l.e}</i><span>${l.v}</span></div>`

/* ---------- input ---------- */

let aimId=null;
